server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/manifest+json application/json;

  include /etc/nginx/security-headers.conf;

  # File dell'app: il browser li riconvalida sempre (il service worker li tiene anche per l'uso offline)
  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
  }

  location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/security-headers.conf;
  }

  location /icons/ {
    add_header Cache-Control "public, max-age=86400" always;
    include /etc/nginx/security-headers.conf;
  }

  location /api/ {
    client_max_body_size 16k;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    # sovrascrive qualsiasi X-Real-IP mandato dal client: serve al limite dei tentativi nel backend
    proxy_set_header X-Real-IP $remote_addr;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/security-headers.conf;
  }
}
