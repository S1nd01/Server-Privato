name: homeserver

# Le porte pubblicate sul computer restano di default su 127.0.0.1 (BIND_ADDR): dal telefono e da fuori casa
# si passa da Tailscale, unico proxy del progetto: pubblica i servizi in HTTPS (vedi tailscale/serve.json e docs/tailscale.md).
# Per raggiungerli anche dalla rete di casa senza Tailscale: BIND_ADDR=0.0.0.0 nel .env.

# Log dei container: senza questo Docker li tiene senza limite e il disco si riempie piano piano (e l'SD del Raspberry si consuma).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------- App (frontend + backend/API) ----------
  frontend:
    image: nginx:alpine
    container_name: hs_frontend
    logging: *logging
    ports:
      - "127.0.0.1:8088:80"   # solo dal PC stesso: il pannello comanda Docker, non va esposto in LAN
    volumes:
      - ./src/frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./src/backend
    container_name: hs_backend
    logging: *logging
    environment:
      TZ: ${TZ}
      API_TOKEN_HASH: ${API_TOKEN_HASH:-}
      API_TOKEN: ${API_TOKEN:-}   # vecchio metodo in chiaro, solo compatibilita'
      # percorsi HOST (per i container figli lanciati dal backend)
      HOST_DATA_DIR: ${DATA_DIR:?Percorsi non inizializzati - lancia ./src/scripts/start.sh oppure ./src/scripts/sync-env.sh}
      HOST_PHOTOS_DIR: ${DATA_DIR}/photos
      RESTIC_IMAGE: ${RESTIC_IMAGE:-restic/restic:latest}
      RESTIC_REPO_DIR: ${RESTIC_REPO_DIR:-}
      RESTIC_PASSWORD_FILE: ${RESTIC_PASSWORD_FILE:-}
      RESTIC_SCHEDULE: ${RESTIC_SCHEDULE:-03:30}
      RESTIC_KEEP_DAILY: ${RESTIC_KEEP_DAILY:-7}
      RESTIC_KEEP_WEEKLY: ${RESTIC_KEEP_WEEKLY:-4}
      RESTIC_KEEP_MONTHLY: ${RESTIC_KEEP_MONTHLY:-6}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # sola lettura: servono al backend per sapere cosa c'e' da salvare e se l'archivio e' pronto
      - ${DATA_DIR}:/data/datadir:ro
      - ${DATA_DIR}/photos:/data/photos:ro
      - ${DATA_DIR}/backups/restic:/data/restic-repo:ro
      - ${RESTIC_PASSWORD_FILE:-/dev/null}:/data/restic-pass:ro
      - ${DATA_DIR}/panel:/data/panel   # stato della pianificazione
    restart: unless-stopped

  # ---------- Tailscale: accesso da fuori casa, in HTTPS ----------
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    logging: *logging
    oom_score_adj: -500
    hostname: ${TS_HOSTNAME:-homeserver}
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-homeserver}
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"    # niente /dev/net/tun ne' privilegi: funziona anche nella WSL
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${DATA_DIR}/tailscale:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    restart: unless-stopped

  # ---------- Immich ----------
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich_server
    logging: *logging
    volumes:
      - ${DATA_DIR}/immich/upload:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: immich_postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich_redis
    ports:
      - "${BIND_ADDR:-127.0.0.1}:2283:2283"
    depends_on:
      - immich-redis
      - immich-postgres
    restart: unless-stopped

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    container_name: immich_machine_learning
    logging: *logging
    cpu_shares: 512
    mem_limit: 3g          # riconoscimento volti e ricerca: il piu' pesante di Immich
    oom_score_adj: 500     # se la RAM finisce, e' il primo a essere fermato
    volumes:
      - ${DATA_DIR}/immich/model-cache:/cache
    restart: unless-stopped

  immich-redis:
    image: docker.io/valkey/valkey:8-bookworm
    container_name: immich_redis
    logging: *logging
    restart: unless-stopped

  immich-postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich_postgres
    logging: *logging
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${DATA_DIR}/immich/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  # ---------- Jellyfin ----------
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    logging: *logging
    user: "${PUID:-1000}:${PGID:-1000}"   # le cartelle le crea src/scripts/sync-env.sh col tuo utente
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_DIR}/jellyfin/config:/config
      - ${DATA_DIR}/jellyfin/cache:/cache
      - ${DATA_DIR}/media:/media:ro
      # Unica eccezione alla sola lettura: JellyBridge ci scrive i segnaposto dei contenuti da scoprire (docs/seerr.md)
      - ${DATA_DIR}/media/Discoveries:/media/Discoveries
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8096:8096"
    restart: unless-stopped

  # ---------- Richieste e download automatici (docs/seerr.md) ----------
  # Flusso: Jellyfin + JellyBridge -> richiesta in Seerr -> Radarr (film) / Sonarr (serie) -> qBittorrent -> Film / Serie TV.
  # Radarr, Sonarr e qBittorrent montano la stessa cartella media di Jellyfin con lo stesso percorso interno (/media):
  # e' quello che permette l'importazione dei file (e i collegamenti fisici, senza copie doppie).
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    logging: *logging
    init: true
    # Come gli altri servizi gira col tuo utente (PUID:PGID): l'immagine ufficiale userebbe l'utente 1000 e,
    # se la cartella config e' di un altro utente, scrive "EACCES mkdir /app/config/logs".
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_DIR}/seerr/config:/app/config
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5055:5055"
    depends_on:
      - jellyfin
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    logging: *logging
    cpu_shares: 512
    mem_limit: 2g
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ}
      WEBUI_PORT: "8080"
    volumes:
      - ${DATA_DIR}/qbittorrent/config:/config
      - ${DATA_DIR}/media:/media
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"
      # La porta dei peer (6881) non e' pubblicata, come tutto il resto: nessuna porta aperta sul router.
      # I download funzionano lo stesso (connessioni in uscita), ma possono essere piu' lenti.
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    logging: *logging
    cpu_shares: 512
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ}
    volumes:
      - ${DATA_DIR}/prowlarr/config:/config
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9696:9696"
    systctls:
      - net.ipv6.conf.all.disable_ipv6=0
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    logging: *logging
    cpu_shares: 512
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ}
    volumes:
      - ${DATA_DIR}/radarr/config:/config
      - ${DATA_DIR}/media:/media
    ports:
      - "${BIND_ADDR:-127.0.0.1}:7878:7878"
    depends_on:
      - qbittorrent
      - prowlarr
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    logging: *logging
    cpu_shares: 512
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ}
    volumes:
      - ${DATA_DIR}/sonarr/config:/config
      - ${DATA_DIR}/media:/media
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8989:8989"
    depends_on:
      - qbittorrent
      - prowlarr
    restart: unless-stopped

  # Sottotitoli automatici per Radarr e Sonarr (docs/bazarr.md). Stesso percorso /media degli altri: scrive i .srt accanto ai video.
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    logging: *logging
    cpu_shares: 512
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ}
    volumes:
      - ${DATA_DIR}/bazarr/config:/config
      - ${DATA_DIR}/media:/media
    ports:
      - "${BIND_ADDR:-127.0.0.1}:6767:6767"
    depends_on:
      - radarr
      - sonarr
    restart: unless-stopped

  # Browser headless che Prowlarr usa per gli indexer protetti da Cloudflare. Nessuna porta pubblicata: lo chiama solo Prowlarr
  # (http://flaresolverr:8191). Quando risolve una sfida usa parecchia RAM: il limite protegge il resto del server.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    logging: *logging
    cpu_shares: 256
    oom_score_adj: 500
    environment:
      TZ: ${TZ}
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
    mem_limit: 1g
    restart: unless-stopped

  # ---------- Vaultwarden ----------
  # Da telefono e PC si passa da Tailscale (HTTPS valido, porta 8443 in tailscale/serve.json).
  # Unica porta pubblicata: 127.0.0.1:8222 in HTTP, per aprire il vault dal server stesso se Tailscale non funziona
  # (localhost e' un contesto sicuro per il browser). Volutamente non segue BIND_ADDR: in LAN sarebbe HTTP in chiaro.
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    logging: *logging
    oom_score_adj: -500
    environment:
      TZ: ${TZ}
      DOMAIN: ${VW_DOMAIN:-http://localhost:8222}
      SIGNUPS_ALLOWED: ${VW_SIGNUPS:-true}
      INVITATIONS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ports:
      - "127.0.0.1:8222:80"
    volumes:
      - ${DATA_DIR}/vaultwarden:/data
    restart: unless-stopped

  # ---------- Pi-hole ----------
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    logging: *logging
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:?PIHOLE_PASSWORD manca nel .env - lancia ./src/scripts/sync-env.sh}
      FTLCONF_dns_listeningMode: ALL   # necessario con la rete bridge di Docker
    volumes:
      - ${DATA_DIR}/pihole:/etc/pihole
    ports:
      # DNS solo sul computer finche' non decidi di usarlo per tutta la rete (docs/pihole.md)
      - "${PIHOLE_DNS_BIND:-127.0.0.1}:53:53/tcp"
      - "${PIHOLE_DNS_BIND:-127.0.0.1}:53:53/udp"
      - "${PIHOLE_WEB_BIND:-127.0.0.1}:8053:80/tcp"
    restart: unless-stopped

  # ---------- Portainer: gestione grafica di Docker ----------
  # Si apre da Tailscale (https://<nome>.ts.net:9443) o dal server (https://localhost:9443, certificato autofirmato).
  # Monta il socket Docker come il backend del pannello: chi entra controlla la macchina. Per questo la porta e' sempre
  # su 127.0.0.1 (come il pannello, ignora BIND_ADDR) e non va mai aperta in LAN.
  # Il primo utente amministratore va creato entro 5 minuti dall'avvio, altrimenti: docker compose restart portainer
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    logging: *logging
    ports:
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR}/portainer:/data
    restart: unless-stopped

  # ---------- Monitoraggio e notifiche (docs/uptime-kuma.md, docs/ntfy.md) ----------
  # Non monta il socket Docker: controlla i servizi con richieste HTTP/TCP verso i nomi dei container.
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    logging: *logging
    volumes:
      - ${DATA_DIR}/kuma:/app/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3001:3001"
    restart: unless-stopped

  # Notifiche push sul telefono (app ntfy). Accesso solo con utente e password: si crea con `ntfy user add` (docs/ntfy.md).
  ntfy:
    image: binwiederhold/ntfy:latest
    container_name: ntfy
    logging: *logging
    command: serve
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ}
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://localhost:2586}
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_BEHIND_PROXY: "true"
    volumes:
      - ${DATA_DIR}/ntfy:/var/lib/ntfy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:2586:80"
    restart: unless-stopped

  # ---------- Strumenti (non partono con `up`) ----------
  # Ripristino da backup:   docker compose run --rm restic snapshots
  #                         docker compose run --rm restic restore latest --target /restore
  restic:
    image: ${RESTIC_IMAGE:-restic/restic:latest}
    profiles: ["tools"]
    environment:
      RESTIC_REPOSITORY: /repo
      RESTIC_PASSWORD_FILE: /run/restic-pass
    volumes:
      - ${DATA_DIR}/backups/restic:/repo
      - ${RESTIC_PASSWORD_FILE:-/dev/null}:/run/restic-pass:ro
      - ${DATA_DIR}/restore:/restore
