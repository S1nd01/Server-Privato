name: homeserver

services:
  # ---------- App (frontend + backend/API) ----------
  frontend:
    image: nginx:alpine
    container_name: hs_frontend
    ports:
      - "127.0.0.1:8088:80"   # solo dal PC stesso: il pannello comanda Docker, non va esposto in LAN
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: hs_backend
    environment:
      API_TOKEN_HASH: ${API_TOKEN_HASH:-}
      API_TOKEN: ${API_TOKEN:-}   # vecchio metodo in chiaro, solo compatibilita'
      STEAMCMD_IMAGE: ${STEAMCMD_IMAGE:-steamcmd/steamcmd:latest}
      # percorsi HOST (per i container figli lanciati dal backend)
      HOST_STEAM_CONFIG_DIR: ${DATA_DIR}/steamcmd
      HOST_STEAM_GAMES_DIR: ${STEAM_GAMES_DIR}
      WG_EXPOSE_PEERS: ${WG_EXPOSE_PEERS:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR}/steamcmd:/data/steamcmd
      - ${STEAM_GAMES_DIR}:/data/games
      - ${DATA_DIR}/wireguard:/data/wireguard:ro
    restart: unless-stopped

  # ---------- Immich ----------
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich_server
    volumes:
      - ${DATA_DIR}/immich/upload:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: immich_postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich_redis
    ports:
      - "2283:2283"
    depends_on:
      - immich-redis
      - immich-postgres
    restart: unless-stopped

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    container_name: immich_machine_learning
    volumes:
      - immich-model-cache:/cache
    restart: unless-stopped

  immich-redis:
    image: docker.io/valkey/valkey:8-bookworm
    container_name: immich_redis
    restart: unless-stopped

  immich-postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich_postgres
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${DATA_DIR}/immich/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  # ---------- Vaultwarden (nessuna porta pubblicata: si passa solo da Caddy) ----------
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    environment:
      TZ: ${TZ}
      DOMAIN: https://${VW_HOST:-localhost}:${VW_PORT:-8443}
      SIGNUPS_ALLOWED: ${VW_SIGNUPS:-true}
      INVITATIONS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - ${DATA_DIR}/vaultwarden:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    environment:
      VW_HOST: ${VW_HOST:-localhost}
    ports:
      - "${VW_PORT:-8443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data   # contiene la CA locale: non cancellarlo o dovrai rifare la fiducia sui dispositivi
      - caddy-config:/config
    depends_on:
      - vaultwarden
    restart: unless-stopped

  # ---------- WireGuard ----------
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ}
      SERVERURL: ${WG_HOST}
      SERVERPORT: 51820
      PEERS: ${WG_PEERS:-telefono,portatile}
      PEERDNS: auto
      INTERNAL_SUBNET: 10.13.13.0
      ALLOWEDIPS: ${WG_ALLOWEDIPS:-10.13.13.0/24}
      LOG_CONFS: "false"   # non stampare i QR (con le chiavi private) nei log
    volumes:
      - ${DATA_DIR}/wireguard:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped

  # ---------- SteamCMD: shell interattiva per il PRIMO login (non parte con `up`) ----------
  #   docker compose run --rm steamcmd +login IL_TUO_USERNAME
  steamcmd:
    image: ${STEAMCMD_IMAGE:-steamcmd/steamcmd:latest}
    profiles: ["tools"]
    stdin_open: true
    tty: true
    volumes:
      - ${DATA_DIR}/steamcmd:/root/.local/share/Steam
      - ${STEAM_GAMES_DIR}:/data/games

volumes:
  immich-model-cache:
  caddy-data:
  caddy-config:
