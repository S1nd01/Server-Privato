name: homeserver

services:
  # ---------- App (frontend + backend/API) ----------
  frontend:
    image: nginx:alpine
    container_name: hs_frontend
    ports:
      - "8088:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: hs_backend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # ---------- Immich ----------
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich_server
    volumes:
      - ${DATA_DIR}/immich/upload:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: immich_postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich_redis
    ports:
      - "2283:2283"
    depends_on:
      - immich-redis
      - immich-postgres
    restart: unless-stopped

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    container_name: immich_machine_learning
    volumes:
      - immich-model-cache:/cache
    restart: unless-stopped

  immich-redis:
    image: docker.io/valkey/valkey:8-bookworm
    container_name: immich_redis
    restart: unless-stopped

  immich-postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich_postgres
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${DATA_DIR}/immich/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  # ---------- Vaultwarden ----------
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    environment:
      DOMAIN: "http://localhost:8080"
      SIGNUPS_ALLOWED: "true"   # metti false dopo aver creato il tuo account
    volumes:
      - ${DATA_DIR}/vaultwarden:/data
    ports:
      - "8080:80"
    restart: unless-stopped

  # ---------- WireGuard ----------
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ}
      SERVERURL: ${WG_HOST}
      SERVERPORT: 51820
      PEERS: ${WG_PEERS:-2}
    volumes:
      - ${DATA_DIR}/wireguard:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped

  # ---------- Steam (linuxserver/steam) ----------
  steam:
    image: lscr.io/linuxserver/steam:latest
    container_name: steam
    security_opt:
      - seccomp:unconfined
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ}
    volumes:
      - ${DATA_DIR}/steam:/config
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "3000:3000"
      - "3001:3001"
    shm_size: "1gb"
    restart: unless-stopped

volumes:
  immich-model-cache:
