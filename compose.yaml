name: homeserver

# Tutte le porte pubblicate sul computer stanno su 127.0.0.1: dal telefono e da fuori casa si passa da Tailscale, unico proxy
# del progetto, che pubblica i servizi in HTTPS (vedi tailscale/serve.json e docs/tailscale.md).
# Uniche eccezioni, scelte una per una: Jellyfin e Seerr seguono LAN_BIND_ADDR (127.0.0.1 di serie; 0.0.0.0 per usarli dalla
# rete di casa senza Tailscale). Se LAN_BIND_ADDR manca vale ancora BIND_ADDR (compatibilita'), ma ora tocca solo quei due.
#
# Reti: ogni gruppo di servizi sta in una rete propria e vede solo i suoi vicini (elenco e motivi in docs/reti.md).
# Tailscale (pubblica) e Uptime Kuma (controlla) sono gli unici a entrare in piu' reti.
# Socket Docker: solo il backend del pannello (e Portainer, su richiesta) lo montano per intero. Diun e Autoheal passano da
# due proxy a permessi minimi (docker-proxy-ro, docker-proxy-rw). Beszel agent e' l'eccezione, spiegata sul servizio.

# Log dei container: senza questo Docker li tiene senza limite e il disco si riempie piano piano (e l'SD del Raspberry si consuma).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------- App (frontend + backend/API) ----------
  frontend:
    # Si costruisce qui (src/Dockerfile.frontend): nginx con la PWA statica e la schermata iniziale in React, compilata durante la build.
    # Dopo ogni modifica a src/frontend o src/hero: docker compose up -d --build frontend
    build:
      context: ./src
      dockerfile: Dockerfile.frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:alpine}
    container_name: hs_frontend
    logging: *logging
    ports:
      - "127.0.0.1:8088:80"   # solo dal PC stesso: il pannello comanda Docker, non va esposto in LAN
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
    networks:
      - panel
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - autoheal=true
    depends_on:
      backend:
        condition: service_healthy   # nginx ora parte anche senza backend, ma cosi' il pannello si apre quando le API rispondono
    restart: unless-stopped

  backend:
    build: ./src/backend
    container_name: hs_backend
    logging: *logging
    environment:
      TZ: ${TZ}
      API_TOKEN_HASH: ${API_TOKEN_HASH:-}
      API_TOKEN: ${API_TOKEN:-}   # vecchio metodo in chiaro, solo compatibilita'
      # percorsi HOST (per i container figli lanciati dal backend)
      HOST_DATA_DIR: ${DATA_DIR:?Percorsi non inizializzati - lancia ./src/scripts/start.sh oppure ./src/scripts/sync-env.sh}
      HOST_PHOTOS_DIR: ${DATA_DIR}/photos
      RESTIC_IMAGE: ${RESTIC_IMAGE:-restic/restic:latest}
      RESTIC_REPO_DIR: ${RESTIC_REPO_DIR:-}
      RESTIC_PASSWORD_FILE: ${RESTIC_PASSWORD_FILE:-}
      # Disco esterno per l'archivio (src/scripts/backup-disco.sh); vuoti = archivio locale in data/backups
      BACKUP_DISK_DIR: ${BACKUP_DISK_DIR:-}
      BACKUP_MOUNT_PARENT: ${BACKUP_MOUNT_PARENT:-${DATA_DIR}/backups}
      BACKUP_WARN_DAYS: ${BACKUP_WARN_DAYS:-14}
      RESTIC_KEEP_DAILY: ${RESTIC_KEEP_DAILY:-7}
      RESTIC_KEEP_WEEKLY: ${RESTIC_KEEP_WEEKLY:-4}
      RESTIC_KEEP_MONTHLY: ${RESTIC_KEEP_MONTHLY:-6}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # sola lettura: servono al backend per sapere cosa c'e' da salvare e se l'archivio e' pronto
      - ${DATA_DIR}:/data/datadir:ro
      - ${DATA_DIR}/photos:/data/photos:ro
      # La cartella che CONTIENE il disco di backup, con propagazione rslave: il disco si collega e si scollega a caldo e il
      # backend se ne accorge senza riavviarsi. Sola lettura: l'archivio lo scrive il container restic lanciato per ogni lavoro.
      - type: bind
        source: ${BACKUP_MOUNT_PARENT:-${DATA_DIR}/backups}
        target: /data/backup-parent
        read_only: true
        bind:
          propagation: rslave
      - ${RESTIC_PASSWORD_FILE:-/dev/null}:/data/restic-pass:ro
      - ${DATA_DIR}/panel:/data/panel   # stato del pannello (servizi spenti, ultima copia di backup)
    labels:
      - diun.enable=false   # immagine costruita in locale: niente da controllare su un registro
      - autoheal=true
    networks:
      - panel
    security_opt:
      - no-new-privileges:true
    # /api/health non chiede il token e non tocca Docker: dice solo che il processo risponde. L'immagine non ha curl.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ---------- Tailscale: accesso da fuori casa, in HTTPS ----------
  tailscale:
    image: ${TAILSCALE_IMAGE:-tailscale/tailscale:latest}
    container_name: tailscale
    logging: *logging
    oom_score_adj: -500
    hostname: ${TS_HOSTNAME:-homeserver}
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-homeserver}
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"    # niente /dev/net/tun ne' privilegi: funziona anche nella WSL
      TS_SERVE_CONFIG: /config/serve.json
      TS_ROUTES: ${TS_ROUTES:-}   # IP del server per Pi-hole fuori casa (docs/setup-pihole.md)
    volumes:
      - ${DATA_DIR}/tailscale:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    # Entra in tutte le reti dei servizi che pubblica (ogni upstream di serve.json deve stare in una di queste).
    networks:
      - panel
      - photos
      - media
      - arr
      - vault
      - tools
      - notify
    restart: unless-stopped

  # ---------- Immich ----------
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich_server
    logging: *logging
    volumes:
      - ${DATA_DIR}/immich/upload:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: immich_postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich_redis
    ports:
      - "127.0.0.1:2283:2283"
    networks:
      - photos
      - immich_db
    depends_on:
      immich-redis:
        condition: service_healthy
      immich-postgres:
        condition: service_healthy   # dopo un `up` Immich non parte finche' il database non accetta connessioni
    labels:
      - autoheal=true
    restart: unless-stopped

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    container_name: immich_machine_learning
    logging: *logging
    cpu_shares: 512
    mem_limit: 3g          # riconoscimento volti e ricerca: il piu' pesante di Immich
    oom_score_adj: 500     # se la RAM finisce, e' il primo a essere fermato
    volumes:
      - ${DATA_DIR}/immich/model-cache:/cache
    networks:
      - photos
    restart: unless-stopped

  immich-redis:
    image: docker.io/valkey/valkey:8-bookworm
    container_name: immich_redis
    logging: *logging
    networks:
      - immich_db
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG || redis-cli ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  immich-postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich_postgres
    logging: *logging
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${DATA_DIR}/immich/postgres:/var/lib/postgresql/data
    networks:
      - immich_db
    healthcheck:
      # -h 127.0.0.1: durante l'inizializzazione Postgres ascolta solo sul socket; via TCP risponde solo il server vero
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d immich || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---------- Jellyfin ----------
  jellyfin:
    image: ${JELLYFIN_IMAGE:-jellyfin/jellyfin:latest}
    container_name: jellyfin
    logging: *logging
    user: "${PUID:-1000}:${PGID:-1000}"   # le cartelle le crea src/scripts/sync-env.sh col tuo utente
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_DIR}/jellyfin/config:/config
      - ${DATA_DIR}/jellyfin/cache:/cache
      - ${DATA_DIR}/media:/media:ro
      # Unica eccezione alla sola lettura: JellyBridge ci scrive i segnaposto dei contenuti da scoprire (docs/seerr.md)
      - ${DATA_DIR}/media/Discoveries:/media/Discoveries
    ports:
      - "${LAN_BIND_ADDR:-${BIND_ADDR:-127.0.0.1}}:8096:8096"   # una delle due porte che possono stare in LAN (LAN_BIND_ADDR)
    networks:
      - media
    labels:
      - autoheal=true
    restart: unless-stopped

  # ---------- Richieste e download automatici (docs/seerr.md) ----------
  # Flusso: Jellyfin + JellyBridge -> richiesta in Seerr -> Radarr (film) / Sonarr (serie) -> qBittorrent -> Film / Serie TV.
  # Radarr, Sonarr e qBittorrent montano la stessa cartella media di Jellyfin con lo stesso percorso interno (/media):
  # e' quello che permette l'importazione dei file (e i collegamenti fisici, senza copie doppie).
  seerr:
    image: ${SEERR_IMAGE:-ghcr.io/seerr-team/seerr:latest}
    container_name: seerr
    logging: *logging
    init: true
    # Come gli altri servizi gira col tuo utente (PUID:PGID): l'immagine ufficiale userebbe l'utente 1000 e,
    # se la cartella config e' di un altro utente, scrive "EACCES mkdir /app/config/logs".
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_DIR}/seerr/config:/app/config
    ports:
      - "${LAN_BIND_ADDR:-${BIND_ADDR:-127.0.0.1}}:5055:5055"   # l'altra porta che puo' stare in LAN (LAN_BIND_ADDR)
    networks:
      - media
    depends_on:
      - jellyfin
    restart: unless-stopped

  # Pulizia della libreria: crea in Jellyfin delle collezioni con i film e le serie che non guardi piu' e, passati i giorni
  # che scegli, li toglie da Radarr/Sonarr. Cancella solo quello che decidi tu nelle regole (docs/maintainerr.md).
  maintainerr:
    image: ${MAINTAINERR_IMAGE:-maintainerr/maintainerr:latest}
    container_name: maintainerr
    logging: *logging
    user: "${PUID:-1000}:${PGID:-1000}"
    cpu_shares: 256
    mem_limit: 512m
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_DIR}/maintainerr:/opt/data
    ports:
      - "127.0.0.1:6246:6246"
    networks:
      - media
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6246 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    labels:
      - autoheal=true
    restart: unless-stopped

  qbittorrent:
    image: ${QBITTORRENT_IMAGE:-lscr.io/linuxserver/qbittorrent:latest}
    container_name: qbittorrent
    logging: *logging
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ}
      WEBUI_PORT: "8080"
    volumes:
      - ${DATA_DIR}/qbittorrent/config:/config
      - ${DATA_DIR}/media:/media
    ports:
      - "127.0.0.1:8080:8080"
      # La porta dei peer (6881) non e' pubblicata, come tutto il resto: nessuna porta aperta sul router.
      # I download funzionano lo stesso (connessioni in uscita), ma possono essere piu' lenti.
    networks:
      - arr   # contenuti non fidati: qui non vede Jellyfin, Vaultwarden, i database ne' il pannello
    restart: unless-stopped

  prowlarr:
    image: ${PROWLARR_IMAGE:-lscr.io/linuxserver/prowlarr:latest}
    container_name: prowlarr
    logging: *logging
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ}
    volumes:
      - ${DATA_DIR}/prowlarr/config:/config
    ports:
      - "127.0.0.1:9696:9696"
    networks:
      - arr
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1   # senza, gli indexer dietro Cloudflare davano "Resource temporarily unavailable" (rete IPv6 non funzionante)
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:9696/ping || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    labels:
      - autoheal=true
    restart: unless-stopped

  radarr:
    image: ${RADARR_IMAGE:-lscr.io/linuxserver/radarr:latest}
    container_name: radarr
    logging: *logging
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ}
    volumes:
      - ${DATA_DIR}/radarr/config:/config
      - ${DATA_DIR}/media:/media
    ports:
      - "127.0.0.1:7878:7878"
    networks:
      - arr      # qBittorrent, Prowlarr
      - media    # Jellyfin (aggiornamento libreria), Seerr, Maintainerr
      - notify   # ntfy
    depends_on:
      - qbittorrent
      - prowlarr
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:7878/ping || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    labels:
      - autoheal=true
    restart: unless-stopped

  sonarr:
    image: ${SONARR_IMAGE:-lscr.io/linuxserver/sonarr:latest}
    container_name: sonarr
    logging: *logging
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ}
    volumes:
      - ${DATA_DIR}/sonarr/config:/config
      - ${DATA_DIR}/media:/media
    ports:
      - "127.0.0.1:8989:8989"
    networks:
      - arr
      - media
      - notify
    depends_on:
      - qbittorrent
      - prowlarr
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8989/ping || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    labels:
      - autoheal=true
    restart: unless-stopped

  # Sottotitoli automatici per Radarr e Sonarr (docs/bazarr.md). Stesso percorso /media degli altri: scrive i .srt accanto ai video.
  bazarr:
    image: ${BAZARR_IMAGE:-lscr.io/linuxserver/bazarr:latest}
    container_name: bazarr
    logging: *logging
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ}
    volumes:
      - ${DATA_DIR}/bazarr/config:/config
      - ${DATA_DIR}/media:/media
    ports:
      - "127.0.0.1:6767:6767"
    networks:
      - arr
    depends_on:
      - radarr
      - sonarr
    restart: unless-stopped

  # Sincronizza in Radarr e Sonarr i profili di qualita' e i punteggi delle guide TRaSH (docs/recyclarr.md).
  # Una volta al giorno (RECYCLARR_SCHEDULE), il resto del tempo e' fermo. Fa parte del gruppo "Download automatici".
  # Le chiavi API le scrive nel .env src/scripts/post-avvio.sh (non esistono prima del primo avvio di Radarr e Sonarr).
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    logging: *logging
    user: "${PUID:-1000}:${PGID:-1000}"
    cpu_shares: 256
    mem_limit: 256m
    environment:
      TZ: ${TZ}
      CRON_SCHEDULE: ${RECYCLARR_SCHEDULE:-@daily}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
    volumes:
      - ${DATA_DIR}/recyclarr/config:/config
    networks:
      - arr
    depends_on:
      - radarr
      - sonarr
    restart: unless-stopped

  # Browser headless che Prowlarr usa per gli indexer protetti da Cloudflare. Nessuna porta pubblicata: lo chiama solo Prowlarr
  # (http://flaresolverr:8191). Quando risolve una sfida usa parecchia RAM: se la memoria finisce e' il primo a essere fermato (oom_score_adj).
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    logging: *logging
    oom_score_adj: 500
    environment:
      TZ: ${TZ}
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
    networks:
      - arr
    restart: unless-stopped

  # ---------- Vaultwarden ----------
  # Da telefono e PC si passa da Tailscale (HTTPS valido, porta 8443 in tailscale/serve.json).
  # Unica porta pubblicata: 127.0.0.1:8222 in HTTP, per aprire il vault dal server stesso se Tailscale non funziona
  # (localhost e' un contesto sicuro per il browser). Volutamente non segue BIND_ADDR: in LAN sarebbe HTTP in chiaro.
  vaultwarden:
    image: ${VAULTWARDEN_IMAGE:-vaultwarden/server:latest}
    container_name: vaultwarden
    logging: *logging
    oom_score_adj: -500
    environment:
      TZ: ${TZ}
      DOMAIN: ${VW_DOMAIN:-http://localhost:8222}
      SIGNUPS_ALLOWED: ${VW_SIGNUPS:-true}
      INVITATIONS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ports:
      - "127.0.0.1:8222:80"
    volumes:
      - ${DATA_DIR}/vaultwarden:/data
    networks:
      - vault   # solo Tailscale (e Uptime Kuma) lo raggiungono: nessun servizio di download o di media lo vede
    labels:
      - autoheal=true
    restart: unless-stopped

  # ---------- Pi-hole ----------
  pihole:
    image: ${PIHOLE_IMAGE:-pihole/pihole:latest}
    container_name: pihole
    logging: *logging
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:?PIHOLE_PASSWORD manca nel .env - lancia ./src/scripts/sync-env.sh}
      FTLCONF_dns_listeningMode: ALL   # necessario con la rete bridge di Docker
    volumes:
      - ${DATA_DIR}/pihole:/etc/pihole
    ports:
      # DNS solo sul computer finche' non decidi di usarlo per tutta la rete (docs/pihole.md)
      - "${PIHOLE_DNS_BIND:-127.0.0.1}:53:53/tcp"
      - "${PIHOLE_DNS_BIND:-127.0.0.1}:53:53/udp"
      - "${PIHOLE_WEB_BIND:-127.0.0.1}:8053:80/tcp"
    networks:
      - tools    # interfaccia web via Tailscale, aggiornamento delle liste
      - dns      # per parlare con Unbound (docs/unbound.md)
    labels:
      - autoheal=true
    restart: unless-stopped

  # DNS ricorsivo: Pi-hole filtra, Unbound risolve senza passare da Google o Cloudflare (docs/unbound.md).
  # Parte spento "di fatto": Pi-hole continua a usare il suo upstream finche' non lanci ./src/scripts/pihole-unbound.sh on.
  # Sta su una rete privata solo sua e di Pi-hole (indirizzo fisso) e non pubblica nessuna porta.
  unbound:
    image: alpinelinux/unbound:latest
    container_name: unbound
    logging: *logging
    cpu_shares: 256
    mem_limit: 128m
    volumes:
      - ./unbound/unbound.conf:/etc/unbound/unbound.conf:ro
    networks:
      dns:
        ipv4_address: 10.89.53.2
    restart: unless-stopped

  # ---------- Portainer: gestione grafica di Docker ----------
  # Si apre da Tailscale (https://<nome>.ts.net:9443) o dal server (https://localhost:9443, certificato autofirmato).
  # Monta il socket Docker come il backend del pannello: chi entra controlla la macchina. Per questo la porta e' sempre
  # su 127.0.0.1 e non va mai aperta in LAN. Duplica in parte il pannello, quindi NON parte con `up`: si avvia solo quando serve
  #   docker compose --profile admin-tools up -d portainer      (e si ferma con: docker compose stop portainer)
  # Il primo utente amministratore va creato entro 5 minuti dall'avvio, altrimenti: docker compose restart portainer
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    logging: *logging
    profiles: ["admin-tools"]
    ports:
      - "127.0.0.1:9443:9443"
    networks:
      - tools
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR}/portainer:/data
    restart: unless-stopped

  # ---------- Monitoraggio e notifiche (docs/uptime-kuma.md, docs/ntfy.md) ----------
  # Non monta il socket Docker: controlla i servizi con richieste HTTP/TCP verso i nomi dei container.
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    logging: *logging
    volumes:
      - ${DATA_DIR}/kuma:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    # Controlla i servizi per nome (docs/uptime-kuma.md), quindi entra in tutte le reti tranne quella interna del database:
    # e' il prezzo del monitoraggio. Non monta il socket Docker.
    networks:
      - panel
      - photos
      - media
      - arr
      - vault
      - tools
      - notify
    labels:
      - autoheal=true
    restart: unless-stopped

  # Notifiche push sul telefono (app ntfy). Accesso solo con utente e password: si crea con `ntfy user add` (docs/ntfy.md).
  ntfy:
    image: ${NTFY_IMAGE:-binwiederhier/ntfy:latest}
    container_name: ntfy
    logging: *logging
    command: serve
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ}
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://localhost:2586}
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_BEHIND_PROXY: "true"
    volumes:
      - ${DATA_DIR}/ntfy:/var/lib/ntfy
    ports:
      - "127.0.0.1:2586:80"
    networks:
      - notify
    restart: unless-stopped

  # Inoltra le notifiche di ntfy al tuo chat Telegram (docs/telegram.md). Solo in uscita: nessuna porta, nessun socket Docker, e non legge
  # i messaggi che arrivano al bot. Non parte con `up` (profilo "telegram"): lo attiva ./src/scripts/telegram-setup.sh.
  # I segreti (token del bot, token ntfy in SOLA LETTURA) stanno in data/telegram, montata in sola lettura.
  ntfy-telegram:
    image: ${TELEGRAM_BRIDGE_IMAGE:-python:3.12-alpine}
    container_name: ntfy-telegram
    profiles: ["telegram"]
    logging: *logging
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    command: ["python", "-I", "-u", "/app/ntfy-telegram.py"]
    cpu_shares: 128
    mem_limit: 64m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ}
      NTFY_URL: http://ntfy:80
      NTFY_TOPIC: ${TELEGRAM_NTFY_TOPIC:-homeserver}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./src/telegram:/app:ro
      - ${DATA_DIR}/telegram:/run/secrets:ro
      - ${DATA_DIR}/telegram/state:/state
    healthcheck:
      # il ponte scrive un "battito" in /state/alive a ogni riga di ntfy (almeno una ogni 45 secondi)
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/state/alive')<180 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - autoheal=true
    networks:
      - notify
    restart: unless-stopped

  # ---------- Monitoraggio delle risorse (docs/beszel.md) ----------
  # Storico di CPU, RAM, dischi, rete, temperatura e container. L'agente parla con il hub tramite un socket condiviso
  # (nessuna porta in piu'). Il primo utente amministratore si crea nel hub, subito dopo l'avvio.
  # L'agente ha bisogno della chiave pubblica del hub (BESZEL_KEY): la scrive src/scripts/post-avvio.sh.
  beszel:
    image: ${BESZEL_IMAGE:-henrygd/beszel:latest}
    container_name: beszel
    logging: *logging
    cpu_shares: 256
    mem_limit: 256m
    environment:
      TZ: ${TZ}
      APP_URL: ${BESZEL_APP_URL:-http://localhost:8090}
    volumes:
      - ${DATA_DIR}/beszel/data:/beszel_data
      - ${DATA_DIR}/beszel/socket:/beszel_socket
    ports:
      - "127.0.0.1:8090:8090"
    networks:
      - tools
    restart: unless-stopped

  # Rete "host" per misurare le schede di rete vere del computer. ECCEZIONE ai proxy: resta sul socket Docker. Il `:ro` limita
  # il file, non le chiamate all'API (si possono comunque creare container): equivale a root, come Portainer e il backend.
  # Non passa dal proxy perche' (1) in rete host non entra nelle reti interne dei proxy e andrebbe pubblicata una porta sul
  # computer, e (2) con i proxy per socket sono segnalati scollegamenti dopo qualche ora (issue 11notes/docker-socket-proxy #10:
  # proxy diverso, non verificato con questo). Da riprovare con docker-proxy-ro se serve toglierlo.
  beszel-agent:
    image: ${BESZEL_AGENT_IMAGE:-henrygd/beszel-agent:latest}
    container_name: beszel-agent
    logging: *logging
    network_mode: host
    cpu_shares: 256
    mem_limit: 128m
    environment:
      LISTEN: /beszel_socket/beszel.sock
      KEY: ${BESZEL_KEY:-}
    volumes:
      - ${DATA_DIR}/beszel/agent:/var/lib/beszel-agent
      - ${DATA_DIR}/beszel/socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - beszel
    restart: unless-stopped

  # ---------- Proxy del socket Docker (docs/security.md, sezione Socket Docker) ----------
  # Diun e Autoheal non montano piu' il socket: parlano con questi due proxy su reti interne (senza accesso a Internet e senza
  # altri servizi). Ogni proxy lascia passare solo le chiamate elencate; il resto (creare container, exec, volumi, reti...) e' rifiutato.
  # Limite da conoscere: CONTAINERS=1 permette di leggere i dettagli dei container, comprese le variabili d'ambiente (e quindi
  # eventuali password passate cosi'). Si toglie la scrittura, non la lettura.
  docker-proxy-ro:   # Diun: elenca i container e le immagini in uso
    image: ${DOCKER_PROXY_IMAGE:-tecnativa/docker-socket-proxy:latest}
    container_name: docker-proxy-ro
    logging: *logging
    cpu_shares: 256
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      POST: "0"          # sola lettura (GET/HEAD)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dockerproxy_ro
    restart: unless-stopped

  docker-proxy-rw:   # Autoheal: elenca i container e riavvia quelli "unhealthy"
    image: ${DOCKER_PROXY_IMAGE:-tecnativa/docker-socket-proxy:latest}
    container_name: docker-proxy-rw
    logging: *logging
    cpu_shares: 256
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    environment:
      CONTAINERS: "1"
      ALLOW_RESTARTS: "1"   # solo stop/restart/kill di un container; niente POST generico, quindi niente creazione/exec
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dockerproxy_rw
    restart: unless-stopped

  # ---------- Utility: manutenzione (docs/manutenzione.md) ----------
  # Nel pannello sono un unico interruttore ("Manutenzione"): Diun e Autoheal pesano pochi MB e di solito restano accesi.
  # Diun NON aggiorna nulla: controlla i registri e ti manda una notifica ntfy quando esce una nuova versione di un'immagine.
  # Aggiorni tu: docker compose pull && docker compose up -d
  diun:
    image: crazymax/diun:latest
    container_name: diun
    logging: *logging
    command: serve
    cpu_shares: 256
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
      DIUN_WATCH_WORKERS: "2"
      DIUN_WATCH_SCHEDULE: "${DIUN_SCHEDULE:-0 8 * * *}"   # ogni giorno alle 8; se il server e' spento passa al controllo dopo
      DIUN_WATCH_JITTER: 30s
      DIUN_WATCH_FIRSTCHECKNOTIF: "false"   # al primo giro memorizza e basta, niente raffica di notifiche
      DIUN_PROVIDERS_DOCKER: "true"
      DIUN_PROVIDERS_DOCKER_ENDPOINT: tcp://docker-proxy-ro:2375   # niente socket montato: passa dal proxy in sola lettura
      DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT: "true"   # tutte le immagini, tranne i container con l'etichetta diun.enable=false
      DIUN_NOTIF_NTFY_ENDPOINT: http://ntfy:80
      DIUN_NOTIF_NTFY_TOPIC: ${DIUN_NTFY_TOPIC:-homeserver}
      # ntfy e' in deny-all: Diun accetta solo un token di accesso, non utente e password (docs/manutenzione.md)
      DIUN_NOTIF_NTFY_TOKEN: ${DIUN_NTFY_TOKEN:-}
    volumes:
      - ${DATA_DIR}/diun:/data
    networks:
      - dockerproxy_ro   # interna: solo il proxy
      - notify           # ntfy e uscita verso i registri delle immagini
    depends_on:
      - docker-proxy-ro   # se Diun parte prima del proxy non si connette (diun issue 1225)
    restart: unless-stopped

  # Riavvia i container che Docker segna come "unhealthy". Agisce SOLO su quelli con l'etichetta autoheal=true
  # (pannello, Jellyfin, Immich, Radarr, Sonarr, Prowlarr, Vaultwarden, Pi-hole, Uptime Kuma): un controllo di salute sbagliato su un
  # servizio senza etichetta non puo' farlo riavviare in continuazione. I container fermati dal pannello non li tocca.
  # Non monta il socket: riavvia i container tramite docker-proxy-rw, che permette solo elenco e riavvio.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    logging: *logging
    cpu_shares: 256
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ}
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "30"
      AUTOHEAL_START_PERIOD: "120"   # attesa dopo l'avvio di Autoheal prima del primo controllo
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "20"
      DOCKER_SOCK: tcp://docker-proxy-rw:2375
    networks:
      - dockerproxy_rw
    depends_on:
      - docker-proxy-rw
    restart: unless-stopped

  # ---------- Utility: compressione video (docs/compressione.md) ----------
  # Ricodifica in HEVC i film e le serie GIA' in libreria per liberare spazio. Nel pannello ha un interruttore a parte
  # (gruppo Utility): tienilo spento finche' non serve, la CPU al 100% per ore rallenta Jellyfin e tutto il resto.
  # Non ha nessuna autenticazione: per questo la porta e' solo su 127.0.0.1 (e da Tailscale, che e' solo tuo).
  # Monta /media con lo stesso percorso di Radarr e Sonarr: i file ricompressi restano dove li aspettano.
  unmanic:
    image: josh5/unmanic:latest
    container_name: unmanic
    logging: *logging
    cpus: "${UNMANIC_CPUS:-2}"        # tetto di CPU: piu' basso dei core del server, cosi' il resto respira
    cpu_shares: 256
    mem_limit: ${UNMANIC_MEM:-2g}     # 4K e preset lenti possono volerne di piu'
    oom_score_adj: 500
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ}
    volumes:
      - ${DATA_DIR}/unmanic/config:/config
      - ${DATA_DIR}/unmanic/cache:/tmp/unmanic   # file temporanei della conversione (un file per worker)
      - ${DATA_DIR}/media:/media
    ports:
      - "127.0.0.1:8888:8888"
    networks:
      - tools
    # Accelerazione hardware (Intel QuickSync / VAAPI): togli il commento SOLO se /dev/dri esiste sul server,
    # altrimenti Docker non avvia il container. Non c'e' in WSL ne' sul Raspberry Pi.
    # devices:
    #   - /dev/dri:/dev/dri
    restart: unless-stopped

  # ---------- Strumenti (non partono con `up`) ----------
  # Ripristino da backup:   docker compose run --rm restic snapshots
  #                         docker compose run --rm restic restore latest --target /restore
  restic:
    image: ${RESTIC_IMAGE:-restic/restic:latest}
    profiles: ["tools"]
    environment:
      RESTIC_REPOSITORY: /repo
      RESTIC_PASSWORD_FILE: /run/restic-pass
    volumes:
      # create_host_path: false = se il disco non e' collegato dà errore, invece di creare la cartella sul disco di sistema
      - type: bind
        source: ${RESTIC_REPO_DIR:-${DATA_DIR}/backups/restic}
        target: /repo
        bind:
          create_host_path: false
      - ${RESTIC_PASSWORD_FILE:-/dev/null}:/run/restic-pass:ro
      - ${DATA_DIR}/restore:/restore

# Rete privata tra Pi-hole e Unbound (indirizzo fisso: Pi-hole accetta come upstream solo un IP).
# Se 10.89.53.0/28 coincide con una rete tua, cambia i tre indirizzi qui, in unbound/unbound.conf e in src/scripts/pihole-unbound.sh.
networks:
  dns:
    name: homeserver_dns
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.53.0/28

  # Reti dei gruppi (docs/reti.md). Le subnet sono fisse (10.89.10-19.x) per non finire sulla rete di casa: senza, Docker le
  # sceglie da solo e, dopo una quindicina di reti, comincia a usare 192.168.x.x. Se una coincide con una tua, cambiala qui.
  panel:           # pannello (nginx + backend), Tailscale, Uptime Kuma
    ipam: { config: [{ subnet: 10.89.10.0/27 }] }
  photos:          # Immich (server + riconoscimento): ha accesso a Internet (modelli)
    ipam: { config: [{ subnet: 10.89.11.0/27 }] }
  immich_db:       # database e cache di Immich: INTERNA, nessun accesso a Internet ne' agli altri servizi
    internal: true
    ipam: { config: [{ subnet: 10.89.12.0/28 }] }
  media:           # Jellyfin, Seerr, Maintainerr, Radarr, Sonarr
    ipam: { config: [{ subnet: 10.89.13.0/27 }] }
  arr:             # download: qBittorrent, Prowlarr, FlareSolverr, Bazarr, Recyclarr, Radarr, Sonarr
    ipam: { config: [{ subnet: 10.89.14.0/27 }] }
  vault:           # Vaultwarden
    ipam: { config: [{ subnet: 10.89.15.0/28 }] }
  tools:           # interfacce di amministrazione raggiunte da Tailscale: Pi-hole, Portainer, Unmanic, Beszel
    ipam: { config: [{ subnet: 10.89.16.0/27 }] }
  notify:          # ntfy e chi gli scrive: Radarr, Sonarr, Diun, Uptime Kuma; il ponte Telegram (ntfy-telegram) lo legge
    ipam: { config: [{ subnet: 10.89.17.0/27 }] }
  dockerproxy_ro:  # Diun <-> proxy in sola lettura: INTERNA
    internal: true
    ipam: { config: [{ subnet: 10.89.18.0/29 }] }
  dockerproxy_rw:  # Autoheal <-> proxy con riavvio: INTERNA
    internal: true
    ipam: { config: [{ subnet: 10.89.19.0/29 }] }
