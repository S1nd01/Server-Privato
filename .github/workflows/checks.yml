name: Verifiche homeserver

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configurazione e sintassi
        run: |
          python src/scripts/check-config.py
          git ls-files -z 'src/scripts/*.sh' | xargs -0 -n1 bash -n
          git ls-files -z 'src/frontend/src/*.js' 'src/frontend/public/*.js' | xargs -0 -n1 node --check
      - name: Build del pannello
        run: |
          docker build -f src/Dockerfile.frontend src
          docker build -f src/backend/Dockerfile src/backend
      - name: Test Python e integrazione Docker
        run: |
          python -m pip install -r src/backend/requirements.txt pytest httpx
          python -m pytest -q src/backend/tests src/docker-gate src/telegram
      - name: Ripristino Restic con dati di prova
        run: |
          dir=$(mktemp -d)
          mkdir "$dir/repo" "$dir/source" "$dir/restore"
          printf 'password di prova\n' > "$dir/pass"
          printf 'verifica di ripristino\n' > "$dir/source/prova.txt"
          restic() {
            docker run --rm --user "$(id -u):$(id -g)" --network none -e RESTIC_CACHE_DIR=/tmp/cache \
              --mount "type=bind,source=$dir,target=/work" restic/restic:latest \
              -r /work/repo --password-file /work/pass "$@"
          }
          restic init
          restic backup /work/source
          restic check --read-data
          restic restore latest --target /work/restore
          cmp "$dir/source/prova.txt" "$dir/restore/work/source/prova.txt"
