server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Nota: add_header in un `location` sostituisce quelli del livello server, quindi sono ripetuti.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

  location /api/ {
    client_max_body_size 16k;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    # sovrascrive qualsiasi X-Real-IP mandato dal client: serve al limite dei tentativi nel backend
    proxy_set_header X-Real-IP $remote_addr;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
  }
}
