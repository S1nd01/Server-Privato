# Unbound: DNS ricorsivo locale dietro Pi-hole (docs/unbound.md).
# Pi-hole filtra, Unbound risolve i nomi interrogando direttamente i server radice e quelli dei domini:
# le tue richieste non passano da Google, Cloudflare o dal DNS del provider.
# Ascolta solo sulla rete interna "dns" (10.89.53.0/28) che condivide con Pi-hole: nessuna porta sul computer.
server:
  verbosity: 0
  interface: 0.0.0.0
  port: 5335
  do-ip4: yes
  do-udp: yes
  do-tcp: yes
  do-ip6: no          # la rete IPv6 dei container non e' affidabile (vedi Prowlarr in docs/seerr.md)
  prefer-ip6: no

  # Chi puo' chiedere: solo Pi-hole (e il controllo interno). Tutto il resto e' rifiutato.
  access-control: 127.0.0.0/8 allow
  access-control: 10.89.53.0/28 allow

  hide-identity: yes
  hide-version: yes
  harden-glue: yes
  harden-dnssec-stripped: yes
  use-caps-for-id: no
  edns-buffer-size: 1232

  # Prestazioni, pensate per un Raspberry Pi
  num-threads: 1
  msg-cache-size: 16m
  rrset-cache-size: 32m
  so-rcvbuf: 1m
  prefetch: yes            # rinnova in anticipo i nomi usati spesso: le risposte restano in cache
  cache-min-ttl: 300
  cache-max-ttl: 86400
  # Se la linea e' lenta o cade, risponde con l'ultimo valore noto invece di non rispondere
  serve-expired: yes
  serve-expired-ttl: 86400
  serve-expired-client-timeout: 1800

  # Non restituire mai indirizzi privati per nomi pubblici (protezione dal DNS rebinding)
  private-address: 10.0.0.0/8
  private-address: 172.16.0.0/12
  private-address: 192.168.0.0/16
  private-address: 169.254.0.0/16
  private-address: fd00::/8
  private-address: fe80::/10
