# Recyclarr: sincronizza in Radarr e Sonarr i profili di qualita' e i punteggi delle guide TRaSH (docs/recyclarr.md).
# sync-env.sh copia questo file in data/recyclarr/config/recyclarr.yml SOLO se li' non esiste: da quel momento
# la copia in data/ e' la tua e puoi modificarla; questa resta come modello.
#
# Le chiavi API arrivano dal .env (RADARR_API_KEY, SONARR_API_KEY): le scrive src/scripts/post-avvio.sh leggendole
# dalla configurazione di Radarr e Sonarr, che esiste solo dopo il loro primo avvio.
#
# Con "trash_id" un profilo guida porta con se' i custom format e i punteggi consigliati dalla guida.
# Non attivare "reset_unmatched_scores" senza leggere docs/recyclarr.md: azzera anche i custom format creati a mano
# (per esempio quello dell'audio italiano).

radarr:
  film:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true

    quality_definition:
      type: movie

    quality_profiles:
      - trash_id: d1d67249d3890e49bc12e275d989a7e9   # HD Bluray + WEB (1080p). Per il 4K: 64fb5f9858489bdac2af690e27c8f42f (UHD Bluray + WEB)

sonarr:
  serie:
    base_url: http://sonarr:8989
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true

    quality_definition:
      type: series

    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1   # WEB-1080p
