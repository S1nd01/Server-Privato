<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Homeserver</title>
  <meta name="description" content="Pannello di controllo del tuo home server">
  <meta name="theme-color" content="#1E181D">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Homeserver">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preload" href="/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <section id="gate" hidden>
    <form id="gate-form" autocomplete="off">
      <img src="/icons/icon.svg" alt="" width="56" height="56">
      <h1>Homeserver</h1>
      <p>Inserisci il token del pannello, quello mostrato da gen-api-token.sh.</p>
      <label for="token">Token</label>
      <input id="token" name="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <label class="check"><input id="remember" type="checkbox"> Ricorda su questo dispositivo</label>
      <p id="gate-msg" class="notice" data-kind="error" role="alert" hidden></p>
      <button class="btn primary" type="submit">Entra</button>
    </form>
  </section>

  <div id="app" hidden>
    <header class="bezel">
      <div class="brand">
        <img src="/icons/icon.svg" alt="" width="28" height="28">
        <div><strong>Homeserver</strong><span id="summary">Controllo in corso</span></div>
      </div>
      <div id="leds" class="leds" role="img" aria-label="Stato dei servizi"></div>
    </header>

    <nav aria-label="Sezioni">
      <a href="#servizi"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><circle cx="7" cy="7" r=".9"/><circle cx="7" cy="17" r=".9"/></svg><span>Servizi</span></a>
      <a href="#steam"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14"/></svg><span>Steam</span></a>
      <a href="#backup"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6z"/><path d="m9 12 2 2 4-4"/></svg><span>Backup</span></a>
      <a href="#rete"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span>Rete</span></a>
    </nav>

    <main id="view" tabindex="-1"></main>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p>Serve JavaScript per usare il pannello.</p></noscript>
</body>
</html>
